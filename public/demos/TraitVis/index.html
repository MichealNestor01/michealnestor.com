<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>TraitVis</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <header id="bar">
      <h1>TraitVis</h1>
      <label aria-disabled="true" id="drop"
        >Drop a dataset folder here, then choose which attributes to load.
        <input disabled id="folder" multiple type="file" webkitdirectory
      /></label>
      <button id="sample" type="button" disabled>
        Load sample (Isabel timestep02 subset)
      </button>
      <p id="memory">Memory: 0 MB / 2048 MB</p>
      <progress hidden id="progress" max="1" value="0"></progress>
      <p id="status">Starting…</p>
      <p id="error"></p>
      <div id="picker" hidden>
        <p id="picker-title">Choose attributes</p>
        <div id="picker-list"></div>
        <p id="picker-note"></p>
        <button id="picker-load" type="button">Load selected</button>
        <button id="picker-cancel" type="button">Cancel</button>
      </div>
    </header>
    <div id="view">
      <canvas
        id="canvas"
        oncontextmenu="event.preventDefault()"
        tabindex="-1"
      ></canvas>
    </div>
    <p id="webgl-fallback">WebGL2 is not available in this browser.</p>
    <script src="upload.js"></script>
    <script src="traitvis.js" async></script>
  </body>
</html>
